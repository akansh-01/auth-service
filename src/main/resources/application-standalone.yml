server:
  port: 9898

spring:
  application:
    name: auth-service
  
  cloud:
    config:
      enabled: false  # Disable Config Server for standalone mode

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_project
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration/local/
    schemas: auth
    create-schemas: true
    baseline-on-migrate: true
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default-schema: auth

# Eureka Client Configuration - DISABLED for standalone mode
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  tracing:
    enabled: false  # Disable tracing for standalone mode
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans  # Not used when disabled

# Application Info
info:
  app:
    name: Auth Service
    description: Authentication and Authorization Service for Healthcare System
    version: 1.0.0
    mode: standalone

# JWT Configuration
auth:
  secret: TaqlmGv1iEDMRiFp/pHuID1+T8YvZdy0tK5xfvaksuM=
  access-token-expiration: 900000      # 15 minutes in milliseconds
  refresh-token-expiration: 604800000  # 7 days in milliseconds

