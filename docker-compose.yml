version: '3.8'

services:
  # PostgreSQL Database for Auth Service
  auth-db:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eureka Service Discovery
  eureka-server:
    image: akanshproject/eureka-server:latest  # You'll need to create this
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - healthcare-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Spring Boot Admin Server
  admin-server:
    image: akanshproject/admin-server:latest  # You'll need to create this
    container_name: admin-server
    ports:
      - "9090:9090"
    networks:
      - healthcare-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Zipkin for Distributed Tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kafka & Zookeeper for Event Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - healthcare-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "9898:9898"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/auth_project
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      auth-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9898/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # API Gateway (Spring Cloud Gateway)
  # Uncomment when ready to add
  # api-gateway:
  #   image: akanshproject/api-gateway:latest
  #   container_name: api-gateway
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=docker
  #     - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
  #     - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
  #   depends_on:
  #     - eureka-server
  #     - auth-service
  #   networks:
  #     - healthcare-network

  # Doctor Service (To be created)
  # doctor-service:
  #   image: akanshproject/doctor-service:latest
  #   container_name: doctor-service
  #   ports:
  #     - "9001:9001"
  #   networks:
  #     - healthcare-network

  # Patient Service (To be created)
  # patient-service:
  #   image: akanshproject/patient-service:latest
  #   container_name: patient-service
  #   ports:
  #     - "9002:9002"
  #   networks:
  #     - healthcare-network

  # Appointment Service (To be created)
  # appointment-service:
  #   image: akanshproject/appointment-service:latest
  #   container_name: appointment-service
  #   ports:
  #     - "9003:9003"
  #   networks:
  #     - healthcare-network

  # Notification Service (To be created)
  # notification-service:
  #   image: akanshproject/notification-service:latest
  #   container_name: notification-service
  #   ports:
  #     - "9004:9004"
  #   networks:
  #     - healthcare-network

networks:
  healthcare-network:
    driver: bridge

volumes:
  auth_postgres_data:

